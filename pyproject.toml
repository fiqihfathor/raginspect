[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "raginspect"
version = "0.1.0"
description = "Python bindings for the raginspect RAG Inspection & Profiling Engine"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[tool.maturin]
manifest-path = "rust/raginspect-bindings/Cargo.toml"
module-name = "raginspect"
features = ["extension-module"]
