[package]
name = "raginspect"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Developer <dev@antigravity.ai>"]
description = "A RAG Inspection & Profiling Engine - X-ray for Retrieval Augmented Generation pipelines"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
tiktoken-rs = "0.5"
ratatui = "0.26"
anyhow = "1.0"
colored = "2.1"
comfy-table = "7.1"
chrono = "0.4"
