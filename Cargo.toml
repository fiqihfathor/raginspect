[package]
name = "raginspect"
version = "0.1.0"
edition = "2021"
authors = ["Fiqih Fathur Rahman <fiqihfathor@gmail.com>"]
description = "🔍 RAG Inspection & Profiling Engine — X-ray for Retrieval Augmented Generation pipelines"
license = "MIT"
readme = "README.md"
repository = "https://github.com/fiqihfathor/raginspect"
homepage = "https://github.com/fiqihfathor/raginspect"
documentation = "https://github.com/fiqihfathor/raginspect#readme"
keywords = ["rag", "llm", "retrieval-augmented-generation", "profiling", "observability"]
categories = ["command-line-utilities", "development-tools::profiling", "science"]
exclude = [
    "target/",
    ".github/",
    "README.agy.md",
]

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["full"] }
tiktoken-rs = "0.5"
ratatui = "0.26"
anyhow = "1.0"
colored = "2.1"
comfy-table = "7.1"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bench]]
name = "inspection_benchmark"
harness = false

[workspace]
members = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
